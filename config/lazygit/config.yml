gui:
  # Status panel shows the all-branches graph instead of the splash screen
  statusPanelView: allBranchesLog
  # Branches panel: show ahead/behind against main, not only against upstream
  showDivergenceFromBaseBranch: arrowAndNumber
  sidePanelWidth: 0.4
  expandFocusedSidePanel: true
  showRandomTip: false

# Repos live on NFS, which stalls intermittently. Each auto-fetch triggers a UI-blocking
# refresh, so fetch less often (press `f` in the files panel to fetch on demand).
refresher:
  refreshInterval: 30 # default 10
  fetchInterval: 300 # default 60

git:
  log:
    # Commits panel draws every branch (like `git log --all`), keeping lazygit's colored graph
    showWholeGraph: true
  # Refs and subject first, then hash/author/date. Refs: HEAD cyan, local bold green, remote plain red.
  branchLogCmd: git -c color.decorate.HEAD='bold cyan' -c color.decorate.branch='bold green' -c color.decorate.remoteBranch=red log --graph --color=always --decorate-refs-exclude='refs/remotes/*/HEAD' --pretty=format:'%C(auto)%d%C(reset) %s  %C(yellow)%h%C(reset) %C(blue)%an%C(reset) %C(dim)%ar%C(reset)' {{branchName}} --
  allBranchesLogCmds:
    - git -c color.decorate.HEAD='bold cyan' -c color.decorate.branch='bold green' -c color.decorate.remoteBranch=red log --graph --color=always --exclude=refs/stash --all --decorate-refs-exclude='refs/remotes/*/HEAD' --pretty=format:'%C(auto)%d%C(reset) %s  %C(yellow)%h%C(reset) %C(blue)%an%C(reset) %C(dim)%ar%C(reset)'
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium
